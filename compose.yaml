services:
  sudhaar:
    build: .
    ports:
      - "7860:7860"
    environment:
      PORT: "7860"
      SUDHAAR_DATA: /data
      SUDHAAR_DEV_OTP: "1"
    volumes:
      - sudhaar-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/meta', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
volumes:
  sudhaar-data:
